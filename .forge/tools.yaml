# Forge v2.0 default tool registry (D-04)
#
# Adding a new tool requires only a YAML block below (D-03).
# Each tool must specify: command, output_format, file_patterns.
#
# output_format must match a key in PARSER_DISPATCH
# (forge/parsers/__init__.py): shellcheck_json, sarif,
# clippy_json, checkpatch_emacs, grep_line.

tools:
  shellcheck:
    command: shellcheck
    args: ["-f", "json"]
    output_format: shellcheck_json
    file_patterns: ["*.sh", "*.bash"]
    required: false
    timeout: 30
    enabled: true

  ruff:
    command: ruff
    # Note: ruff outputs SARIF format for structured parsing.
    args: ["check", "--output-format", "sarif", "--no-fix"]
    output_format: sarif
    file_patterns: ["*.py"]
    required: false
    timeout: 30
    enabled: true

  semgrep:
    command: semgrep
    # Note: --config auto downloads rules at runtime.
    # For deterministic CI, override with --config p/default
    # or a local rule path.
    args: ["--sarif", "--config", "auto", "--quiet"]
    output_format: sarif
    file_patterns: ["*.py", "*.js", "*.ts", "*.go", "*.java", "*.rb"]
    required: false
    timeout: 60
    enabled: true

  clippy:
    command: cargo
    args: ["clippy", "--message-format=json", "--quiet"]
    output_format: clippy_json
    file_patterns: ["*.rs"]
    working_dir: cargo_root
    required: false
    timeout: 120
    enabled: true

  non_ascii:
    command: grep
    args: ["-rnP", "[^\\x00-\\x7F]"]
    output_format: grep_line
    file_patterns: ["*.py", "*.sh", "*.js", "*.ts", "*.go", "*.rs", "*.c", "*.h"]
    required: false
    timeout: 10
    enabled: true

  # enabled: false -- requires stdin patch input (Phase 2)
  checkpatch:
    command: scripts/checkpatch.pl
    args: ["--emacs", "--terse", "--no-tree"]
    output_format: checkpatch_emacs
    file_patterns: ["*.c", "*.h"]
    required: false
    timeout: 30
    enabled: false
