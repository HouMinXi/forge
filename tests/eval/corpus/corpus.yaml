# Eval corpus manifest (EVAL-01 SC1).
# Each entry is a real bug that forge should detect.
# Format per D-07: name, diff_file (relative), expected_verdict, axis_tags.
# E1-E7 expected_verdict is PASS (RUNTIME is advisory,
# cannot block; verified per-entry -- these diffs trigger no blocking axis).
# expected_advisory keyword lists (wide-but-fair, case-insensitive
# substring matching).
entries:
  - name: gate-yaml-rce
    diff_file: diffs/gate-yaml-rce.diff
    expected_verdict: HOLD
    axis_tags: [TRUST, SEC]

  - name: E1-stale-nftables
    diff_file: diffs/E1-stale-nftables.diff
    expected_verdict: PASS
    axis_tags: [RUNTIME]
    expected_advisory: ["nftables", "stale", "reload"]

  - name: E2-pcap-suffix
    diff_file: diffs/E2-pcap-suffix.diff
    expected_verdict: PASS
    axis_tags: [RUNTIME]
    expected_advisory: ["pcap", "suffix", "capture"]

  - name: E3-transit-probe
    diff_file: diffs/E3-transit-probe.diff
    expected_verdict: PASS
    axis_tags: [RUNTIME]
    expected_advisory: ["transit", "probe", "routing"]

  - name: E4-curl-tproxy
    diff_file: diffs/E4-curl-tproxy.diff
    expected_verdict: PASS
    axis_tags: [RUNTIME]
    expected_advisory: ["tproxy", "proxy", "curl"]

  - name: E5-fast-502
    diff_file: diffs/E5-fast-502.diff
    expected_verdict: PASS
    axis_tags: [RUNTIME]
    expected_advisory: ["502", "timeout", "upstream"]

  - name: E6-reprobe-blackout
    diff_file: diffs/E6-reprobe-blackout.diff
    expected_verdict: PASS
    axis_tags: [RUNTIME]
    expected_advisory: ["reprobe", "blackout", "probe"]

  - name: E7-killswitch-reprobe
    diff_file: diffs/E7-killswitch-reprobe.diff
    expected_verdict: PASS
    axis_tags: [RUNTIME]
    expected_advisory: ["nftables", "mark", "reprobe", "concurrent"]

  - name: BUG-P12-01
    diff_file: diffs/BUG-P12-01.diff
    expected_verdict: HOLD
    axis_tags: [FIXVAL]

  - name: ttl_class
    diff_file: diffs/ttl_class.diff
    expected_verdict: HOLD
    axis_tags: [RUNTIME, FIXVAL]
    expected_advisory: ["ttl", "class", "header"]

  - name: E8-blast-radius-llm-invoke
    diff_file: diffs/E8-blast-radius-llm-invoke.diff
    expected_verdict: PASS
    axis_tags: [GRAPH-TRIAGE]
    expected_advisory: ["llm_invoke", "impact", "downstream"]

  - name: E9-killswitch-mark-conflict
    diff_file: diffs/E9-killswitch-mark-conflict.diff
    expected_verdict: PASS
    axis_tags: [DAEMON-STATE]
    expected_advisory: ["nftables", "mark", "killswitch", "conflict"]

  # X-series: "the check that cannot fail". Each X entry carries a bug whose
  # code reads as a working guard but whose outcome is fixed, and each is
  # paired with an Xc control: the same file, the same lines touched, correct
  # code. The pair is the measurement. A buggy entry that is flagged proves
  # nothing on its own -- forge flags plenty of diffs -- so the entry counts
  # only when its control is NOT flagged in the same run.
  #
  # expected_advisory is deliberately absent. It scores advisory-findings.json
  # (the RUNTIME / GRAPH-TRIAGE / DAEMON-STATE axes) and never sees the three
  # L1 review passes, which is where these bugs have to be caught. Scoring is
  # by verdict: "caught" means the review exited non-zero.
  #
  # Every X fixture was executed before being committed, buggy side and
  # control side, and the observed difference is recorded in
  # PRE-REGISTRATION.md. A fixture nobody ran is a fixture that might contain
  # no bug -- the first draft of X2 was exactly that.

  - name: X1-guard-always-false
    diff_file: diffs/X1-guard-always-false.diff
    expected_verdict: HOLD
    axis_tags: [L1-SEMANTIC]

  - name: X1c-guard-always-false-control
    diff_file: diffs/X1c-guard-always-false-control.diff
    expected_verdict: PASS
    axis_tags: [L1-SEMANTIC]

  - name: X2-pipeline-exit-mask
    diff_file: diffs/X2-pipeline-exit-mask.diff
    expected_verdict: HOLD
    axis_tags: [L1-SEMANTIC]

  - name: X2c-pipeline-exit-mask-control
    diff_file: diffs/X2c-pipeline-exit-mask-control.diff
    expected_verdict: PASS
    axis_tags: [L1-SEMANTIC]

  - name: X3-noop-handler
    diff_file: diffs/X3-noop-handler.diff
    expected_verdict: HOLD
    axis_tags: [L1-SEMANTIC]

  - name: X3c-noop-handler-control
    diff_file: diffs/X3c-noop-handler-control.diff
    expected_verdict: PASS
    axis_tags: [L1-SEMANTIC]
