# Eval corpus manifest (EVAL-01 SC1).
# Each entry is a real bug that forge should detect.
# Format per D-07: name, diff_file (relative), expected_verdict, axis_tags.
# Plan 20-03 D-06: E1-E6 expected_verdict corrected to PASS (RUNTIME is advisory,
# cannot block; verified per-entry -- these diffs trigger no blocking axis).
# Plan 20-03 D-12: expected_advisory keyword lists (wide-but-fair, case-insensitive
# substring matching).
entries:
  - name: gate-yaml-rce
    diff_file: diffs/gate-yaml-rce.diff
    expected_verdict: HOLD
    axis_tags: [TRUST, SEC]

  - name: E1-stale-nftables
    diff_file: diffs/E1-stale-nftables.diff
    expected_verdict: PASS
    axis_tags: [RUNTIME]
    expected_advisory: ["nftables", "stale", "reload"]

