name: Strict Linux user-service observations (not qualification)
'on':
  workflow_dispatch:
    inputs:
      allow_transient_service:
        description: Explicit one-run ordinary-user service authorization (not qualification)
        type: boolean
        default: false
      expected_source_sha:
        description: Exact reviewed source SHA for this one authorized service observation
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: strict-linux-user-service-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
    - name: Check out the exact dispatched source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check authorization and publish only a bounded summary
      env:
        CONTEXT_REPOSITORY: ${{ github.repository }}
        CONTEXT_RUN_ID: ${{ github.run_id }}
        CONTEXT_RUN_ATTEMPT: ${{ github.run_attempt }}
        CONTEXT_JOB_NAME: ${{ github.job }}
        CONTEXT_WORKFLOW_REF: ${{ github.workflow_ref }}
        CONTEXT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        CONTEXT_SOURCE_SHA: ${{ github.sha }}
        CONTEXT_EVENT_NAME: ${{ github.event_name }}
        ALLOW_TRANSIENT_SERVICE: ${{ inputs.allow_transient_service }}
        EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      shell: bash
      run: |
        exec 2>/dev/null
        set +x
        set -euo pipefail
        umask 077
        evidence=$(mktemp -d "$RUNNER_TEMP/forge-user-service.XXXXXXXX")
        exec 2>"$evidence/private-shell-stderr.txt"
        mkdir -m 700 forge-user-service-public
        args=(--output-dir "$evidence" --expected-source-sha "$EXPECTED_SOURCE_SHA")
        if [[ "$ALLOW_TRANSIENT_SERVICE" == true ]]; then
          args+=(--allow-transient-service)
        fi
        # No PR invocation. The wrapper also checks explicit opt-in, event and
        # exact reviewed source before loading or invoking its native collector.
        set +e
        { /usr/bin/python3 -I -S -B scripts/run_user_service_observation.py "${args[@]}"; } \
          >"$evidence/private-stdout.txt" 2>"$evidence/private-stderr.txt"
        diagnostic_code=$?
        { /usr/bin/python3 -I -S -B scripts/user_service_public_summary.py \
            "$evidence/collector-status.json" "$diagnostic_code"; } \
          >forge-user-service-public/summary.json 2>"$evidence/private-summary-stderr.txt"
        summary_code=$?
        publication_code=$summary_code
        if [[ ( "$summary_code" == 0 || "$summary_code" == 2 ) && \
              -f forge-user-service-public/summary.json && \
              ! -L forge-user-service-public/summary.json && \
              -s forge-user-service-public/summary.json ]] && \
            summary_size=$(wc -c < forge-user-service-public/summary.json) && \
            [[ "$summary_size" =~ ^[0-9]{1,4}$ ]] && \
            (( 10#$summary_size <= 1024 )); then
          printf 'SERVICE_PUBLIC_READY=true\n' >> "$GITHUB_ENV"
          publication_code=$?
        elif [[ "$summary_code" == 0 || "$summary_code" == 2 ]]; then
          publication_code=2
        fi
        if [[ "$diagnostic_code" != 0 ]]; then
          exit "$diagnostic_code"
        fi
        if [[ "$publication_code" != 0 ]]; then
          exit "$publication_code"
        fi
        exit "$summary_code"
    - name: Preserve the public summary including STOP or UNKNOWN
      if: ${{ always() && env.SERVICE_PUBLIC_READY == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: strict-linux-user-service-${{ github.run_id }}-${{ github.run_attempt }}
        path: forge-user-service-public/summary.json
        if-no-files-found: error
        retention-days: 14
