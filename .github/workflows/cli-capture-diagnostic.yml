name: Temporary read-only startup probe
on:
  workflow_dispatch:
    inputs:
      run_startup_probe:
        description: Run the independent read-only startup observation once
        type: boolean
        default: false
      expected_source_sha:
        description: Exact reviewed source commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  startup_probe:
    if: ${{ inputs.run_startup_probe }}
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Observe with system Python without site initialization
        id: probe
        continue-on-error: true
        env:
          EXPECTED: ${{ inputs.expected_source_sha }}
          DISPATCH: ${{ github.sha }}
        shell: bash
        run: |
          exec >/dev/null 2>&1
          set +x
          set -euo pipefail
          umask 077
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ && "$EXPECTED" == "$DISPATCH" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED" ]]
          private="$RUNNER_TEMP/forge-startup-probe"
          [[ ! -e "$private" && ! -L "$private" ]]
          mkdir -m 700 "$private"
          code=0
          timeout --signal=TERM --kill-after=2 30 \
            /usr/bin/python3 -I -S -B scripts/temporary_startup_probe.py \
            >"$private/observation.json" 2>"$private/private-error.log" || code=$?
          printf 'probe_exit=%s\n' "$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Independently validate closed observation
        id: publication
        if: ${{ always() }}
        shell: bash
        run: |
          exec >/dev/null 2>&1
          set +x
          set -euo pipefail
          umask 077
          /usr/bin/python3 -I -S -B - "$RUNNER_TEMP/forge-startup-probe" <<'PY'
          import json, os, pathlib, stat, sys
          root = pathlib.Path(sys.argv[1])
          st = root.lstat()
          assert stat.S_ISDIR(st.st_mode) and stat.S_IMODE(st.st_mode) == 0o700 and st.st_uid == os.getuid()
          fd = os.open(root / 'observation.json', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
          try:
              st = os.fstat(fd)
              assert stat.S_ISREG(st.st_mode) and st.st_nlink == 1 and st.st_uid == os.getuid()
              assert stat.S_IMODE(st.st_mode) == 0o600 and 0 < st.st_size <= 4096
              raw = os.read(fd, 4097)
              assert len(raw) == st.st_size and raw.endswith(b'\n')
          finally:
              os.close(fd)
          def unique(pairs):
              value = {}
              for k,v in pairs:
                  assert k not in value
                  value[k] = v
              return value
          value = json.loads(raw, object_pairs_hook=unique)
          fixed = dict(schema='forge-startup-probe-v1', required_runtime='CPYTHON_314',
                       historical_cause='NOT_ASSESSED', raw='NOT_PUBLISHED')
          enums = dict(runtime={'MATCHED','UNSUPPORTED'}, probe_status={'COMPLETE','UNSUPPORTED','UNAVAILABLE'},
                       system_candidates={'NONE','SOURCE','CACHE','SOURCE_AND_CACHE','UNAVAILABLE'},
                       system_admission={'NOT_RUN','ACCEPTED','REJECTED','UNAVAILABLE'},
                       synthetic_empty={'NOT_RUN','ACCEPTED','REJECTED','UNAVAILABLE'},
                       synthetic_hook={'NOT_RUN','ACCEPTED','REJECTED','UNAVAILABLE'})
          assert type(value) is dict and set(value) == set(fixed) | set(enums)
          assert all(value[k] == v for k,v in fixed.items())
          assert all(type(value[k]) is str and value[k] in allowed for k,allowed in enums.items())
          if value['probe_status'] == 'COMPLETE':
              assert value['runtime'] == 'MATCHED' and value['system_candidates'] != 'UNAVAILABLE'
              assert value['system_admission'] in {'ACCEPTED','REJECTED'}
              assert value['synthetic_empty'] == 'ACCEPTED' and value['synthetic_hook'] == 'REJECTED'
          if value['runtime'] == 'UNSUPPORTED':
              assert all(value[k] == 'NOT_RUN' for k in ('system_admission','synthetic_empty','synthetic_hook'))
          destination = root / 'published.json'
          fd = os.open(destination, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, 'w') as handle:
              handle.write(json.dumps(value, sort_keys=True, separators=(',',':')) + '\n')
          PY
      - name: Upload only closed observation
        if: ${{ always() && steps.publication.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: temporary-startup-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge-startup-probe/published.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve probe status
        if: ${{ always() }}
        env:
          CODE: ${{ steps.probe.outputs.probe_exit }}
          PUBLICATION: ${{ steps.publication.outcome }}
        shell: bash
        run: |
          [[ "$CODE" =~ ^(0|[1-9][0-9]{0,2})$ ]] && (( CODE <= 255 )) || exit 73
          [[ "$PUBLICATION" == success ]] || exit 73
          exit "$CODE"
