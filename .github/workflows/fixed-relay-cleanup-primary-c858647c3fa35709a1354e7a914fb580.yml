name: fixed-relay-cleanup-primary-c858647c3fa35709a1354e7a914fb580
on:
  push:
    branches: ["ci/native-relay-cleanup-c858647c3fa35709a1354e7a914fb580"]
permissions: {}
concurrency:
  group: fixed-relay-cleanup-c858647c3fa35709a1354e7a914fb580
  cancel-in-progress: false
jobs:
  cleanup:
    name: fixed-relay-cleanup-primary
    if: ${{ github.event_name == 'push' && github.repository == 'HouMinXi/forge' && github.actor_id == '19586012' && github.run_number == 1 && github.run_attempt == 1 && github.ref == 'refs/heads/ci/native-relay-cleanup-c858647c3fa35709a1354e7a914fb580' && github.event.before == 'ed6064a3f55da289d5c12ea7b6ff239bd4b9f75e' && github.event.after == github.sha && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: write
      contents: write
    steps:
      - name: Fixed approved target cleanup
        shell: /usr/bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          /usr/bin/python3 -I -S -B - <<'FIXED_CLEANUP_PY'
          import base64, hashlib, json, os, pathlib, runpy, sys, tempfile, zlib
          os.umask(0o077)
          try:
              compressed = base64.b64decode('', validate=True)
              decoder = zlib.decompressobj()
              decoded_bundle = decoder.decompress(compressed, 100001)
              if len(decoded_bundle) > 100000 or decoder.unconsumed_tail or decoder.unused_data or not decoder.eof:
                  raise ValueError("bundle_size")
              bundle = json.loads(decoded_bundle)
              expected = ("targets.py", "http_transport.py", "cleanup_runner.py")
              if set(bundle) != set(expected):
                  raise ValueError("source_set")
              decoded = {}
              for name in expected:
                  row = bundle[name]
                  raw = row["source"].encode()
                  if set(row) != {"source", "sha256"} or hashlib.sha256(raw).hexdigest() != row["sha256"]:
                      raise ValueError("source_hash")
                  decoded[name] = raw
              keep = ("GITHUB_TOKEN", "GITHUB_EVENT_PATH", "GITHUB_EVENT_NAME", "GITHUB_REF", "GITHUB_REPOSITORY", "GITHUB_ACTOR_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_RUN_ID", "GITHUB_SHA", "GITHUB_WORKFLOW_SHA", "GITHUB_WORKFLOW_REF")
              environment = {key: os.environ[key] for key in keep if key in os.environ}
              os.environ.clear()
              os.environ.update(environment)
              os.environ["FIXED_CLEANUP_CONFIG"] = ''
              with tempfile.TemporaryDirectory(prefix="fixed-cleanup-source-") as directory:
                  for name, raw in decoded.items():
                      (pathlib.Path(directory)/name).write_bytes(raw)
                  os.chdir(directory)
                  sys.path.insert(0, directory)
                  runpy.run_path(str(pathlib.Path(directory)/"cleanup_runner.py"), run_name="__main__")
          except SystemExit:
              raise
          except BaseException:
              print('FIXED_RELAY_CLEANUP {"phase":"stopped","code":"bootstrap_failed"}', flush=True)
              raise SystemExit(70) from None
          FIXED_CLEANUP_PY
