      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: linux-*
        path: ${{ runner.temp }}/forge-all-evidence
        merge-multiple: false
    - name: Require all jobs and exact complete node coverage
      env:
        CI_NEEDS_JSON: ${{ toJSON(needs) }}
      run: |-
        python scripts/ci_test_shards.py verify --sha "$GITHUB_SHA" \
          --plan "$RUNNER_TEMP/forge-all-evidence/linux-collection-plan/plan.json" \
          --directory "$RUNNER_TEMP/forge-all-evidence"
