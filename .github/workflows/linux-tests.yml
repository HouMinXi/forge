    - name: Download exact-run collection plan
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: linux-collection-plan
        path: ${{ runner.temp }}/forge-plan
    - name: Run ownership
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.install.outcome == 'success' }}
      timeout-minutes: 20
      run: |-
        python scripts/ci_test_shards.py run --sha "$GITHUB_SHA" \
          --plan "$RUNNER_TEMP/forge-plan/plan.json" --phase ownership \
          --directory "$EVIDENCE" 2>&1 | tee "$EVIDENCE/ownership.log"
    - name: Run cgroup
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.install.outcome == 'success' }}
      timeout-minutes: 15
      run: |-
        runtime_dir="/run/user/$(id -u)"
        export XDG_RUNTIME_DIR="$runtime_dir"
        systemd-run --user --scope --quiet -- \
          python scripts/ci_test_shards.py run --sha "$GITHUB_SHA" \
          --plan "$RUNNER_TEMP/forge-plan/plan.json" --phase cgroup \
          --directory "$EVIDENCE" 2>&1 | tee "$EVIDENCE/cgroup.log"
    - name: Run local
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.install.outcome == 'success' }}
      timeout-minutes: 5
      run: |-
        python scripts/ci_test_shards.py run --sha "$GITHUB_SHA" \
          --plan "$RUNNER_TEMP/forge-plan/plan.json" --phase local \
          --directory "$EVIDENCE" 2>&1 | tee "$EVIDENCE/local.log"
