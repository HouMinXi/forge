        done
        unset private_log
        exec >"$EVIDENCE/step-04.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        # The patch-corpus tests run real mutation sandboxes with bwrap.
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor.
        # This only changes the ephemeral runner.
        # Fixed stage labels only; never dump environment or package configuration.
        setup_start() {
          setup_phase=$1
          setup_started=$SECONDS
          printf 'setup:%s:start\n' "$setup_phase"
        }
        setup_end() {
          printf 'setup:%s:end rc=%s elapsed_s=%s\n' "$setup_phase" "$1" "$((SECONDS - setup_started))"
          setup_phase=
        }
        trap 'setup_rc=$?; set +e; if [[ -n ${setup_phase:-} ]]; then setup_end "$setup_rc"; fi; exit "$setup_rc"' EXIT
        setup_start apt-update
        sudo apt-get update -q
        setup_end 0
        setup_start apt-install
        sudo apt-get install -y -q bubblewrap
        setup_end 0
        setup_start sysctl
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        setup_end 0
        setup_start version
        bwrap --version
        setup_end 0
        setup_start smoke
        bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc true \
          2>&1 | (umask 077; exec tee "$EVIDENCE/bwrap.log")
        setup_end 0
    - name: Publish failed bubblewrap setup transcript
      if: ${{ always() && steps.bwrap.outcome == 'failure' }}
      run: |
        set +x
        python scripts/ci_publish_failure_log.py --directory "$RUNNER_TEMP/forge-evidence" --phase "setup-bwrap"
    - name: Install declared extras and qualified pytest
      id: install
      timeout-minutes: 10
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-05.log install.log system-pytest-install.log system-code-forge-install.log interpreters.log previous-pytest-install.log pip-check.log requirements.freeze.txt; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-05.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python -m pip install -e '.[dev,mcp,semgrep,vertex]' 'pytest==9.2.0' \
          2>&1 | (umask 077; exec tee "$EVIDENCE/install.log")
        # Some FIXVAL fixtures use /usr/bin/python3 and reset PYTHONPATH.
        # Its normal user site works without modifying the system interpreter.
        python -m pip install --target "$(/usr/bin/python3 -m site --user-site)" 'pytest==9.2.0' \
          2>&1 | (umask 077; exec tee "$EVIDENCE/system-pytest-install.log")
        # Invocation-audit tests start /usr/bin/python3 children that import
        # code_forge. Put a copy of the package in its normal user site.
        python -m pip install --no-deps --target "$(/usr/bin/python3 -m site --user-site)" . \
          2>&1 | (umask 077; exec tee "$EVIDENCE/system-code-forge-install.log")
        for interpreter in python /usr/bin/python3; do
          "$interpreter" -c 'import sys, pytest; assert sys.implementation.name == "cpython"; assert sys.version_info[:2] == (3, 12), sys.version; assert pytest.__version__ == "9.2.0"; print(sys.executable, sys.version, "pytest", pytest.__version__)'
        done | (umask 077; exec tee "$EVIDENCE/interpreters.log")
        # Keep the previously qualified runtime executable in an isolated venv.
        # Its qualification cases must not turn into skips when the dev pin moves.
        python -m venv "$RUNNER_TEMP/forge-pytest-9.1.1"
        "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" -m pip install 'pytest==9.1.1' \
          2>&1 | (umask 077; exec tee "$EVIDENCE/previous-pytest-install.log")
        export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        python -m pip check 2>&1 | (umask 077; exec tee "$EVIDENCE/pip-check.log")
        python -m pip freeze | (umask 077; exec tee "$EVIDENCE/requirements.freeze.txt")
    - name: Download exact-run collection plan
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: linux-collection-plan
        path: forge-linux-input/plan
    - name: Run serial service-free shard
      timeout-minutes: 90
      run: |-
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-07.log shard.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-07.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        diagnostic_invocation=$(python -c 'import secrets; print(secrets.token_hex(16))')
        [[ "$diagnostic_invocation" =~ ^[0-9a-f]{32}$ ]]
        printf 'diagnostic_invocation=%s\n' "$diagnostic_invocation" >> "$GITHUB_OUTPUT"
        python scripts/ci_private_transport.py run --sha "$GITHUB_SHA" \
          --plan forge-linux-input/plan/plan.json --phase "shard-${{ matrix.shard }}" \
          --directory "$EVIDENCE" --failure-diagnostic --public-directory forge-linux-public --diagnostic-directory "$EVIDENCE/diagnostics" --diagnostic-invocation "$diagnostic_invocation" 2>&1 | (umask 077; exec tee "$EVIDENCE/shard.log")
      id: shard_receipt
    - name: Prepare fixed public CI summary
      id: public_summary
      if: ${{ always() }}
      env:
        CI_JOB_STATUS: ${{ job.status }}
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-08.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-08.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python scripts/ci_private_transport.py summary --job service-free \
          --status "$CI_JOB_STATUS" --public-directory forge-linux-public
    - name: Prepare fixed public CI diagnostics
      id: public_diagnostics
      if: ${{ always() }}
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_SHARD_INVOCATION: ${{ steps.shard_receipt.outputs.diagnostic_invocation }}
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-90.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-90.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python scripts/ci_private_transport.py diagnostics --job service-free \
          --status "$CI_JOB_STATUS" --directory "$EVIDENCE/diagnostics" \
          --public-directory forge-linux-diagnostics --phase "shard-${{ matrix.shard }}" \
          --invocation "shard-${{ matrix.shard }}=$CI_SHARD_INVOCATION"
    - name: Preserve fixed public diagnostics
      if: ${{ always() && steps.public_diagnostics.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: diagnostics-linux-service-free-${{ matrix.shard }}-${{ github.run_attempt }}
        path: forge-linux-diagnostics/diagnostics.json
        if-no-files-found: error
        retention-days: 14
    - name: 'Archive attempt: linux-shard-${{ matrix.shard }}-evidence'
      if: ${{ always() && steps.public_summary.outcome == 'success' && steps.shard_receipt.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: archive-linux-shard-${{ matrix.shard }}-evidence-${{ github.run_attempt }}
        path: |-
          forge-linux-public/receipt-shard-${{ matrix.shard }}.json
          forge-linux-public/summary.json
        if-no-files-found: error
        retention-days: 14
      id: archive_9
    - name: Preserve linux-shard-${{ matrix.shard }}-evidence
      if: ${{ always() && steps.archive_9.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: linux-shard-${{ matrix.shard }}-evidence
        path: |-
          forge-linux-public/receipt-shard-${{ matrix.shard }}.json
          forge-linux-public/summary.json
        if-no-files-found: error
        retention-days: 14
        overwrite: true
    - name: Archive fixed public summary
      id: archive_public_summary
      if: ${{ always() && steps.public_summary.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: archive-linux-shard-${{ matrix.shard }}-summary-${{ github.run_attempt }}
        path: forge-linux-public/summary.json
        if-no-files-found: error
        retention-days: 14
    - name: Preserve fixed public summary
      if: ${{ always() && steps.archive_public_summary.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: linux-shard-${{ matrix.shard }}-summary
        path: forge-linux-public/summary.json
        if-no-files-found: error
        retention-days: 14
        overwrite: true
    - name: Prepare fixed public failure diagnostic
      id: failure_diagnostic
      if: ${{ always() && steps.shard_receipt.outcome == 'failure' }}
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-09.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-09.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python scripts/ci_failure_diagnostic.py --sha "$GITHUB_SHA" --phase "shard-${{ matrix.shard }}" \
          --plan forge-linux-input/plan/plan.json --directory "$EVIDENCE" \
          --public-directory forge-linux-failure-public --native-details
    - name: Archive fixed public failure diagnostic
      id: archive_failure_diagnostic
      if: ${{ always() && steps.failure_diagnostic.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: archive-forge-ci-failure-shard-${{ matrix.shard }}-${{ github.run_attempt }}
        path: forge-linux-failure-public/failure.json
        if-no-files-found: error
        retention-days: 14
    - name: Preserve fixed public failure diagnostic
      if: ${{ always() && steps.archive_failure_diagnostic.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: forge-ci-failure-shard-${{ matrix.shard }}
        path: forge-linux-failure-public/failure.json
        if-no-files-found: error
        retention-days: 14
        overwrite: true
    - name: Publish failed pytest transcript (shard-${{ matrix.shard }})
      if: ${{ always() && steps.shard_receipt.outcome == 'failure' }}
      run: |
        set +x
        python scripts/ci_publish_failure_log.py --directory "$RUNNER_TEMP/forge-evidence" --phase "shard-${{ matrix.shard }}"
  linux-tests:
    name: linux-tests
    needs:
    - plan
    - process-contracts
    - service-free
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download all exact-run coverage receipts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: linux-*
        path: forge-linux-input/all
        merge-multiple: false
    - name: Require all jobs and exact complete node coverage
      id: coverage_verification
      env:
        CI_NEEDS_JSON: ${{ toJSON(needs) }}
      run: |-
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-02.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-02.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        diagnostic_invocation=$(python -c 'import secrets; print(secrets.token_hex(16))')
        [[ "$diagnostic_invocation" =~ ^[0-9a-f]{32}$ ]]
        printf 'diagnostic_invocation=%s\n' "$diagnostic_invocation" >> "$GITHUB_OUTPUT"
        python scripts/ci_private_transport.py verify --sha "$GITHUB_SHA" \
          --plan forge-linux-input/all/linux-collection-plan/plan.json \
          --directory forge-linux-input/all --diagnostic-directory "$EVIDENCE/diagnostics" --diagnostic-invocation "$diagnostic_invocation"
    - name: Prepare fixed public CI summary
      id: public_summary
      if: ${{ always() }}
      env:
        CI_JOB_STATUS: ${{ job.status }}
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-03.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-03.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python scripts/ci_private_transport.py summary --job linux-tests \
          --status "$CI_JOB_STATUS" --public-directory forge-linux-public
    - name: Prepare fixed public CI diagnostics
      id: public_diagnostics
      if: ${{ always() }}
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_VERIFY_INVOCATION: ${{ steps.coverage_verification.outputs.diagnostic_invocation }}
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-90.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-90.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python scripts/ci_private_transport.py diagnostics --job linux-tests \
          --status "$CI_JOB_STATUS" --directory "$EVIDENCE/diagnostics" \
          --public-directory forge-linux-diagnostics \
          --invocation "verify=$CI_VERIFY_INVOCATION"
    - name: Preserve fixed public diagnostics
      if: ${{ always() && steps.public_diagnostics.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: diagnostics-linux-linux-tests-${{ github.run_attempt }}
        path: forge-linux-diagnostics/diagnostics.json
        if-no-files-found: error
        retention-days: 14
    - name: Preserve fixed aggregate summary
      if: ${{ always() && steps.public_summary.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: linux-aggregate-summary
        path: forge-linux-public/summary.json
        if-no-files-found: error
        retention-days: 14
