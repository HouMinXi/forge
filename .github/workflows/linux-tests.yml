name: Linux tests
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SEMGREP_SEND_METRICS: 'off'
  SEMGREP_ENABLE_VERSION_CHECK: '0'
  OTEL_SDK_DISABLED: 'true'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up qualified Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Verify Linux process ownership prerequisites
      id: preflight
      timeout-minutes: 2
      run: |
        # The stdout-pressure regression needs disk-backed temporary storage.
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        printf 'TMPDIR=%s\nEVIDENCE=%s\n' "$TMPDIR" "$EVIDENCE" >> "$GITHUB_ENV"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        python - <<'PY' 2>&1 | tee "$EVIDENCE/preflight.log"
        import os
        from pathlib import Path
        import resource
        import select
        import subprocess
        import sys

        assert sys.platform == 'linux', sys.platform
        assert sys.implementation.name == 'cpython'
        assert sys.version_info[:2] == (3, 12), sys.version
        assert hasattr(os, 'pidfd_open'), 'Linux pidfd_open is required'
        assert resource.getrlimit(resource.RLIMIT_NOFILE)[1] > 1024, 'High-FD tests must run'
        # Do not treat absent or unreadable task-children as an empty tree.
        children_path = Path(f'/proc/{os.getpid()}/task/{os.getpid()}/children')
        children_path.read_bytes()
        child = subprocess.Popen([sys.executable, '-c', 'import time; time.sleep(30)'])
        try:
            children = {int(pid) for pid in children_path.read_bytes().split()}
            assert child.pid in children, f'Live child {child.pid} absent from {children_path}'
            fd = os.pidfd_open(child.pid)
            try:
                assert not select.select([fd], [], [], 0)[0], 'Live-child pidfd unexpectedly ready'
            finally:
                os.close(fd)
            print(f'PASS: readable {children_path}; live child {child.pid} visible; pidfd usable')
            print(sys.version)
        finally:
            child.terminate()
            child.wait(timeout=5)
        PY
        df -h "$TMPDIR" | tee "$EVIDENCE/disk.log"
    - name: Remove the image's system git-lfs filters
      id: gitconfig
      timeout-minutes: 2
      run: |
        # The runner image ships /etc/gitconfig with git-lfs clean/process
        # filters. The conventions resolver refuses to cache whenever any
        # filter is configured, so its caching tests fail on the image's
        # config. The test suite scrubs every GIT_* variable, so
        # GIT_CONFIG_NOSYSTEM cannot help; edit the ephemeral runner's
        # system config instead. Nothing in this repository uses LFS.
        sudo git config --system --remove-section filter.lfs || true
        # Exit status 1 with no output means no clean/process filter is left.
        rc=0
        git config --system --null --get-regexp '^filter\..*\.(clean|process)$' || rc=$?
        test "$rc" -eq 1
        git config --list --show-origin | tee "$EVIDENCE/git-config.log"
    - name: Install and verify bubblewrap
      id: bwrap
      timeout-minutes: 5
      run: |
        # The patch-corpus tests run real mutation sandboxes with bwrap.
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor.
        # This only changes the ephemeral runner.
        sudo apt-get update -q
        sudo apt-get install -y -q bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        bwrap --version
        bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc true \
          2>&1 | tee "$EVIDENCE/bwrap.log"
    - name: Install declared extras and qualified pytest
      id: install
      timeout-minutes: 10
      run: |
        python -m pip install -e '.[dev,mcp,semgrep,vertex]' 'pytest==9.1.1' \
          2>&1 | tee "$EVIDENCE/install.log"
        # Some FIXVAL fixtures use /usr/bin/python3 and reset PYTHONPATH.
        # Its normal user site works without modifying the system interpreter.
        python -m pip install --target "$(/usr/bin/python3 -m site --user-site)" 'pytest==9.1.1' \
          2>&1 | tee "$EVIDENCE/system-pytest-install.log"
        # Invocation-audit tests start /usr/bin/python3 children that import
        # code_forge. Put a copy of the package in its normal user site.
        python -m pip install --no-deps --target "$(/usr/bin/python3 -m site --user-site)" . \
          2>&1 | tee "$EVIDENCE/system-code-forge-install.log"
        for interpreter in python /usr/bin/python3; do
          "$interpreter" -c 'import sys, pytest; assert sys.implementation.name == "cpython"; assert sys.version_info[:2] == (3, 12), sys.version; assert pytest.__version__ == "9.1.1"; print(sys.executable, sys.version, "pytest", pytest.__version__)'
        done | tee "$EVIDENCE/interpreters.log"
        python -m pip check 2>&1 | tee "$EVIDENCE/pip-check.log"
        python -m pip freeze | tee "$EVIDENCE/requirements.freeze.txt"
    - name: Collect original selections and partition every module
      timeout-minutes: 8
      run: |-
        python scripts/ci_test_shards.py plan --sha "$GITHUB_SHA" \
          --directory "$RUNNER_TEMP/forge-plan" 2>&1 | tee "$EVIDENCE/collection.log"
    - name: 'Archive attempt: linux-collection-plan'
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: archive-linux-collection-plan-${{ github.run_attempt }}
        path: ${{ runner.temp }}/forge-plan/
        if-no-files-found: error
        retention-days: 14
      id: archive_8
    - name: Preserve linux-collection-plan
      if: ${{ always() && steps.archive_8.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: linux-collection-plan
        path: ${{ runner.temp }}/forge-plan/
        if-no-files-found: error
        retention-days: 14
        overwrite: true
    - name: 'Archive attempt: linux-plan-evidence'
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: archive-linux-plan-evidence-${{ github.run_attempt }}
        path: ${{ runner.temp }}/forge-evidence/
        if-no-files-found: error
        retention-days: 14
      id: archive_10
    - name: Preserve linux-plan-evidence
      if: ${{ always() && steps.archive_10.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: linux-plan-evidence
        path: ${{ runner.temp }}/forge-evidence/
        if-no-files-found: error
        retention-days: 14
        overwrite: true
