    - name: Remove private metadata credential
      id: credential_cleanup
      if: ${{ always() }}
      timeout-minutes: 1
      run: |
        /usr/bin/sudo -n -- /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C LANG=C HOME=/nonexistent \
          GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" /usr/bin/python3 -B -I -S - <<'PYCREDENTIALCLEANUP' | /usr/bin/tee "$RUNNER_TEMP/forge-evidence/credential-cleanup.json"
        from __future__ import annotations
        import os, stat, hashlib, re, json
        from pathlib import Path
        from contextlib import contextmanager
        from typing import Any
        BOOTSTRAP_ROOT = Path('/var/lib/forge-ci-bootstrap')
        MAX_CREDENTIAL = 4096
        MAX_FILE = 16 * 1024 * 1024
        MAX_ID = 2 ** 63 - 1
        _SHA256 = re.compile('[0-9a-f]{64}\\Z')
        _BOOT = re.compile('[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}\\Z')

        class SetupError(RuntimeError):
            """Missing, changed, partial or unreviewed evidence requires STOP."""

        def need(condition, message):
            if not condition:
                raise SetupError(message)

        def sha(value, label):
            need(type(value) is str and _SHA256.fullmatch(value) is not None and (value != '0' * 64), 'invalid ' + label + ' digest')
            return value

        def keys(value: Any, keys: set[str], label: str) -> dict:
            need(type(value) is dict and set(value) == keys, f'invalid {label} fields')
            return value

        def _id(value: Any, label: str, *, native: bool=False) -> int:
            if native:
                need(type(value) is str and re.fullmatch('[1-9][0-9]{0,18}', value) is not None, f'invalid native {label}')
                value = int(value)
            need(type(value) is int and 0 < value <= MAX_ID, f'invalid {label}')
            return value

        def read_regular(path: Path, *, limit: int=MAX_FILE) -> bytes:
            """No symlink or FIFO reads, bounded even if the file changes while reading."""
            try:
                fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                with os.fdopen(fd, 'rb') as stream:
                    need(stat.S_ISREG(os.fstat(stream.fileno()).st_mode), 'nonregular input file')
                    raw = stream.read(limit + 1)
            except OSError as exc:
                raise SetupError('cannot read required file') from exc
            need(len(raw) <= limit, 'input file bound exceeded')
            return raw

        def trusted_boot_id():
            value = read_regular(Path('/proc/sys/kernel/random/boot_id'), limit=64).decode('ascii').strip()
            need(_BOOT.fullmatch(value) is not None, 'invalid kernel boot identity')
            return value

        def _credential_stage(run_id, run_attempt):
            _id(run_id, 'credential run id')
            need(type(run_attempt) is int and run_attempt == 1, 'invalid credential run attempt')
            return BOOTSTRAP_ROOT / (str(run_id) + '-1')

        def _credential_parts(layout):
            keys(layout, {'parts'}, 'credential layout')
            parts = layout['parts']
            need(type(parts) in (tuple, list) and 1 <= len(parts) <= 32, 'invalid credential source manifest')
            for index, part in enumerate(parts):
                keys(part, {'name', 'bytes', 'sha256'}, 'credential source part')
                need(part['name'] == f'part-{index:02d}.txt', 'invalid credential source ordering')
                need(type(part['bytes']) is int and 0 < part['bytes'] <= 32000, 'invalid credential source size')
                sha(part['sha256'], 'credential source')
            need(sum((part['bytes'] for part in parts)) <= 256 * 1024, 'credential source bound exceeded')
            return parts

        def _credential_directory(path, *, missing_ok=False):
            need(path.is_absolute() and path.resolve(strict=False) == path, 'invalid credential directory')
            for parent in path.parents:
                info = parent.lstat()
                need(stat.S_ISDIR(info.st_mode) and info.st_uid == info.st_gid == 0 and (not info.st_mode & 18), 'untrusted credential ancestor')
            try:
                info = path.lstat()
            except FileNotFoundError:
                need(missing_ok, 'credential directory is absent')
                return None
            need(stat.S_ISDIR(info.st_mode) and info.st_uid == info.st_gid == 0 and (stat.S_IMODE(info.st_mode) == 448), 'untrusted credential directory')
            return info

        def _credential_identity(info):
            return (info.st_dev, info.st_ino, info.st_mode, info.st_uid, info.st_gid, info.st_nlink, info.st_size)

        @contextmanager
        def _credential_stage_fd(run_id, run_attempt, *, missing_ok=False):
            stage = _credential_stage(run_id, run_attempt)
            if _credential_directory(BOOTSTRAP_ROOT, missing_ok=missing_ok) is None:
                yield (stage, None)
                return
            info = _credential_directory(stage, missing_ok=missing_ok)
            if info is None:
                yield (stage, None)
                return
            fd = os.open(stage, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_NONBLOCK)
            try:
                need(_credential_identity(os.fstat(fd)) == _credential_identity(info), 'credential directory changed')
                yield (stage, fd)
                need(_credential_identity(os.fstat(fd)) == _credential_identity(stage.lstat()), 'credential directory changed')
            finally:
                os.close(fd)

        def _credential_file_info(info, limit):
            need(stat.S_ISREG(info.st_mode) and info.st_uid == info.st_gid == 0 and (info.st_nlink == 1) and (stat.S_IMODE(info.st_mode) == 256) and (0 <= info.st_size <= limit), 'untrusted credential staging file')

        @contextmanager
        def _credential_file_fd(directory_fd, name, limit):
            fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory_fd)
            try:
                info = os.fstat(fd)
                _credential_file_info(info, limit)
                need(_credential_identity(info) == _credential_identity(os.stat(name, dir_fd=directory_fd, follow_symlinks=False)), 'credential staging file changed')
                yield fd
                need(_credential_identity(os.fstat(fd)) == _credential_identity(os.stat(name, dir_fd=directory_fd, follow_symlinks=False)), 'credential staging file changed')
            finally:
                os.close(fd)

        def _credential_read_fd(fd, limit):
            chunks = []
            total = 0
            while total <= limit:
                chunk = os.read(fd, limit + 1 - total)
                if not chunk:
                    break
                chunks.append(chunk)
                total += len(chunk)
            need(total <= limit, 'credential staging file bound exceeded')
            return b''.join(chunks)

        def _credential_inventory(directory_fd, parts, *, token):
            expected = {part['name'] for part in parts} | {'bootstrap-entry.py'}
            if token:
                expected.add('metadata-token')
            need(set(os.listdir(directory_fd)) == expected, 'credential staging inventory changed')
            for part in parts:
                with _credential_file_fd(directory_fd, part['name'], part['bytes']) as fd:
                    raw = _credential_read_fd(fd, part['bytes'])
                    need(len(raw) == part['bytes'] and hashlib.sha256(raw).hexdigest() == part['sha256'], 'credential source part changed')
            with _credential_file_fd(directory_fd, 'bootstrap-entry.py', 65536) as fd:
                need(os.fstat(fd).st_size > 0, 'empty credential entrypoint')
            if token:
                with _credential_file_fd(directory_fd, 'metadata-token', MAX_CREDENTIAL) as fd:
                    need(os.fstat(fd).st_size > 0, 'empty metadata credential')

        def cleanup_metadata_credential(run_id, run_attempt, boot_id, *, credential_layout):
            """Remove only the separately validated token before reporting inventory drift."""
            need(os.getuid() == os.geteuid() == os.getgid() == os.getegid() == 0, 'credential cleanup requires root')
            parts = _credential_parts(credential_layout)
            need(type(boot_id) is str and _BOOT.fullmatch(boot_id) is not None and (boot_id == trusted_boot_id()), 'credential cleanup boot changed')
            try:
                with _credential_stage_fd(run_id, run_attempt, missing_ok=True) as (_, directory_fd):
                    if directory_fd is not None:
                        try:
                            fd = os.open('metadata-token', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory_fd)
                        except FileNotFoundError:
                            fd = None
                        if fd is not None:
                            try:
                                info = os.fstat(fd)
                                _credential_file_info(info, MAX_CREDENTIAL)
                                need(_credential_identity(info) == _credential_identity(os.stat('metadata-token', dir_fd=directory_fd, follow_symlinks=False)), 'credential cleanup file changed')
                                os.unlink('metadata-token', dir_fd=directory_fd)
                                need(os.fstat(fd).st_nlink == 0, 'credential cleanup unlink failed')
                            finally:
                                os.close(fd)
                        need('metadata-token' not in os.listdir(directory_fd), 'credential cleanup token remains')
                        _credential_inventory(directory_fd, parts, token=False)
            except OSError:
                raise SetupError('credential cleanup unavailable') from None
            return {'schema_version': 1, 'status': 'PASS', 'run_id': run_id, 'run_attempt': run_attempt, 'boot_id': boot_id, 'token_absent': True}
        layout = {'parts': [{'name': 'part-00.txt', 'bytes': 8000, 'sha256': '74ce2bcd2b3d6ab55c82d48c37b56cdd5921aab4cc4eda5e8e4cfd00e3e1508e'}, {'name': 'part-01.txt', 'bytes': 8000, 'sha256': '7f09bc0fe93531a0d1946d9e8aa82e4ffb6d0cc4e620cf67e91a243526004798'}, {'name': 'part-02.txt', 'bytes': 8000, 'sha256': '5a82ca016b2db1967f46e8f865090c5e6e087c39cc664454334ca7a7d6908d97'}, {'name': 'part-03.txt', 'bytes': 8000, 'sha256': '4695d8cb8f54bb4498a81c9f7163fc090a96b0e5cf2d11190c5f7e08ea8face3'}, {'name': 'part-04.txt', 'bytes': 8000, 'sha256': '96affe4ccdeda3eb3ef5eee8265e48acb60ceae212264efa8e1bf15863755931'}, {'name': 'part-05.txt', 'bytes': 8000, 'sha256': '5ae964ec33bc7ebfa7b262725ac34b65ee420f308157f6d29a4e9c6970dbc613'}, {'name': 'part-06.txt', 'bytes': 8000, 'sha256': '84ebc3e92be6e1c97e22fef4ecd20d50a417cb8991b5323aa5aab4fb02118e65'}, {'name': 'part-07.txt', 'bytes': 8000, 'sha256': 'fa9f400ebe76ea04ae2918535ccc7b182c3f83cd5be19214ec09d5fefebcc79c'}, {'name': 'part-08.txt', 'bytes': 8000, 'sha256': 'e25bb925465255db51f5ea41abcb43463a6abaaf0d3890558e0837f88af4fe87'}, {'name': 'part-09.txt', 'bytes': 8000, 'sha256': '871815bb398f364355a0ccf041002beb82afeae60a91cc51e2a10c36aa943f5e'}, {'name': 'part-10.txt', 'bytes': 8000, 'sha256': '538c43a44dcd16fa9db7ae12bffa1fc856a67b405d0773f604e00eeb9c3b20d0'}, {'name': 'part-11.txt', 'bytes': 8000, 'sha256': '1b09ef60c4a34347ead751dafc5747314b88267c54cd3a2391798388e7a5e576'}, {'name': 'part-12.txt', 'bytes': 8000, 'sha256': '133163243e97de18296c5893755240e7a9f761f3409e53136e25e6836223282e'}, {'name': 'part-13.txt', 'bytes': 8000, 'sha256': 'a8a608204b1a3398caf5209c00136edbddb7e0a0afc0d2a0afec9f636b596d96'}, {'name': 'part-14.txt', 'bytes': 8000, 'sha256': 'af3c6329d7289ea0a1115b96a4c264db4ba8fa9f1a2c1ea87dfea4779b3a71ff'}, {'name': 'part-15.txt', 'bytes': 4666, 'sha256': 'a69891ce0a006f5094b11c69c16613cc231a9a26ff88d6b1e6297a5d211a1f3c'}]}
        try:
            run_id = _id(os.environ.get('GITHUB_RUN_ID'), 'cleanup run id', native=True)
            attempt = _id(os.environ.get('GITHUB_RUN_ATTEMPT'), 'cleanup attempt', native=True)
            result = cleanup_metadata_credential(run_id, attempt, trusted_boot_id(), credential_layout=layout)
        except BaseException:
            print(json.dumps({'schema_version': 1, 'status': 'STOP', 'token_absent': False,
                              'error': 'credential cleanup failed'}, sort_keys=True, separators=(',', ':')))
            raise SystemExit(1)
        print(json.dumps(result, sort_keys=True, separators=(',', ':')))

        PYCREDENTIALCLEANUP
