  service-free:
    # Test-only pre-translation exception metadata; no payloads, locals or environment dump.
    env:
      FORGE_CI_AUDIT_TRACE: '1'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 0
        - 1
        - 2
        - 3
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up qualified Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Verify Linux process ownership prerequisites
      id: preflight
      timeout-minutes: 2
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-02.log preflight.log disk.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-02.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        # The stdout-pressure regression needs disk-backed temporary storage.
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        python - <<'PY' 2>&1 | (umask 077; exec tee "$EVIDENCE/preflight.log")
        import os
        from pathlib import Path
        import resource
        import select
        import subprocess
        import sys

        assert sys.platform == 'linux', sys.platform
        assert sys.implementation.name == 'cpython'
        assert sys.version_info[:2] == (3, 12), sys.version
        assert hasattr(os, 'pidfd_open'), 'Linux pidfd_open is required'
        assert resource.getrlimit(resource.RLIMIT_NOFILE)[1] > 1024, 'High-FD tests must run'
        # Do not treat absent or unreadable task-children as an empty tree.
        children_path = Path(f'/proc/{os.getpid()}/task/{os.getpid()}/children')
        children_path.read_bytes()
        child = subprocess.Popen([sys.executable, '-c', 'import time; time.sleep(30)'])
        try:
            children = {int(pid) for pid in children_path.read_bytes().split()}
            assert child.pid in children, f'Live child {child.pid} absent from {children_path}'
            fd = os.pidfd_open(child.pid)
            try:
                assert not select.select([fd], [], [], 0)[0], 'Live-child pidfd unexpectedly ready'
            finally:
                os.close(fd)
            print(f'PASS: readable {children_path}; live child {child.pid} visible; pidfd usable')
            print(sys.version)
        finally:
            child.terminate()
            child.wait(timeout=5)
        PY
        df -h "$TMPDIR" | (umask 077; exec tee "$EVIDENCE/disk.log")
    - name: Remove the image's system git-lfs filters
      id: gitconfig
      timeout-minutes: 2
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-03.log git-config.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-03.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        # The runner image ships /etc/gitconfig with git-lfs clean/process
        # filters. The conventions resolver refuses to cache whenever any
        # filter is configured, so its caching tests fail on the image's
        # config. The test suite scrubs every GIT_* variable, so
        # GIT_CONFIG_NOSYSTEM cannot help; edit the ephemeral runner's
        # system config instead. Nothing in this repository uses LFS.
        sudo git config --system --remove-section filter.lfs || true
        # Exit status 1 with no output means no clean/process filter is left.
        rc=0
        git config --system --null --get-regexp '^filter\..*\.(clean|process)$' || rc=$?
