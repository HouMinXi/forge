name: Linux tests

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

# A branch push and its PR share a group; unrelated forks do not.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up qualified Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Verify Linux process ownership prerequisites
        id: preflight
        timeout-minutes: 2
        run: |
          # The stdout-pressure regression needs disk-backed temporary storage.
          export TMPDIR="$RUNNER_TEMP/forge-tests"
          export EVIDENCE="$RUNNER_TEMP/forge-evidence"
          printf 'TMPDIR=%s\nEVIDENCE=%s\n' "$TMPDIR" "$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$TMPDIR" "$EVIDENCE"
          python - <<'PY' 2>&1 | tee "$EVIDENCE/preflight.log"
          import os
          from pathlib import Path
          import resource
          import select
          import subprocess
          import sys

          assert sys.platform == 'linux', sys.platform
          assert sys.implementation.name == 'cpython'
          assert sys.version_info[:3] == (3, 12, 14), sys.version
          assert hasattr(os, 'pidfd_open'), 'Linux pidfd_open is required'
          assert resource.getrlimit(resource.RLIMIT_NOFILE)[1] > 1024, 'High-FD tests must run'
          # Do not treat absent or unreadable task-children as an empty tree.
          children_path = Path(f'/proc/{os.getpid()}/task/{os.getpid()}/children')
          children_path.read_bytes()
          child = subprocess.Popen([sys.executable, '-c', 'import time; time.sleep(30)'])
          try:
              children = {int(pid) for pid in children_path.read_bytes().split()}
              assert child.pid in children, f'Live child {child.pid} absent from {children_path}'
              fd = os.pidfd_open(child.pid)
              try:
                  assert not select.select([fd], [], [], 0)[0], 'Live-child pidfd unexpectedly ready'
              finally:
                  os.close(fd)
              print(f'PASS: readable {children_path}; live child {child.pid} visible; pidfd usable')
              print(sys.version)
          finally:
              child.terminate()
              child.wait(timeout=5)
          PY
          df -h "$TMPDIR" | tee "$EVIDENCE/disk.log"

      - name: Install declared extras and qualified pytest
        id: install
        timeout-minutes: 10
        run: |
          python -m pip install -e '.[dev,mcp,semgrep,vertex]' 'pytest==9.1.1' \
            2>&1 | tee "$EVIDENCE/install.log"
          # Some FIXVAL fixtures use /usr/bin/python3 and reset PYTHONPATH.
          # Its normal user site works without modifying the system interpreter.
          python -m pip install --target "$(/usr/bin/python3 -m site --user-site)" 'pytest==9.1.1' \
            2>&1 | tee "$EVIDENCE/system-pytest-install.log"
          for interpreter in python /usr/bin/python3; do
            "$interpreter" -c 'import sys, pytest; assert sys.implementation.name == "cpython"; assert sys.version_info[:2] == (3, 12), sys.version; assert pytest.__version__ == "9.1.1"; print(sys.executable, sys.version, "pytest", pytest.__version__)'
          done | tee "$EVIDENCE/interpreters.log"
          python -m pip check 2>&1 | tee "$EVIDENCE/pip-check.log"
          python -m pip freeze | tee "$EVIDENCE/requirements.freeze.txt"

      - name: Install and verify Linux sandbox prerequisites
        id: sandbox
        # New apt/probe phase: provisional until its first successful CI timing.
        timeout-minutes: 5
        run: |
          # Avoid the runner's stalled Azure HTTP mirror without changing its sources.
          apt_dir="$(mktemp -d /tmp/forge-apt.XXXXXXXX)"
          chmod 755 "$apt_dir"
          mkdir -p "$apt_dir/lists/partial" "$apt_dir/sourceparts"
          cat > "$apt_dir/ubuntu.sources" <<'APT'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-security
          Components: main
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT
          cp "$apt_dir/ubuntu.sources" "$EVIDENCE/apt-sources.sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_dir/ubuntu.sources"
            -o "Dir::Etc::sourceparts=$apt_dir/sourceparts"
            -o "Dir::State::lists=$apt_dir/lists"
            -o Dir::Cache::pkgcache= -o Dir::Cache::srcpkgcache=
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
            -o Acquire::Retries=2 -o Acquire::Languages=none
          )
          sudo apt-get "${apt_options[@]}" update -o APT::Update::Error-Mode=any \
            2>&1 | tee "$EVIDENCE/apt-update.log"
          apt-cache "${apt_options[@]}" policy bubblewrap \
            2>&1 | tee "$EVIDENCE/bubblewrap-policy.log"
          sudo apt-get "${apt_options[@]}" install --no-install-recommends -y bubblewrap \
            2>&1 | tee "$EVIDENCE/apt-install.log"
          dpkg-query -W -f='${Package} ${Version}\n' bubblewrap | tee "$EVIDENCE/bubblewrap-package.log"
          bwrap --version | tee "$EVIDENCE/bubblewrap-version.log"
          # Data-only vendor inputs for manual admission review. Do not install/load profiles.
          vendor_dir="$EVIDENCE/vendor-packages"
          mkdir -p "$vendor_dir"
          apparmor_version="$(dpkg-query -W -f='${Version}' apparmor)"
          bubblewrap_version="$(dpkg-query -W -f='${Version}' bubblewrap)"
          (
            cd "$vendor_dir"
            apt-get "${apt_options[@]}" download \
              'apparmor-profiles=4.0.1really4.0.1-0ubuntu0.24.04.8' \
              "apparmor=$apparmor_version" "bubblewrap=$bubblewrap_version"
          ) 2>&1 | tee "$EVIDENCE/vendor-download.log"
          printf '%s  %s\n' \
            '4e7d728322f899a7a06e71bedd4f4bd1f20c21f0b3361120f34cf5c0feec849e' \
            "$vendor_dir/apparmor-profiles_4.0.1really4.0.1-0ubuntu0.24.04.8_all.deb" \
            | sha256sum --check
          shopt -s nullglob
          for package in apparmor-profiles apparmor bubblewrap; do
            archives=("$vendor_dir/${package}_"*.deb)
            [[ ${#archives[@]} == 1 ]]
            sha256sum "${archives[0]}" | tee -a "$EVIDENCE/vendor-sha256.log"
            dpkg-deb --field "${archives[0]}" Package Version Architecture \
              | tee -a "$EVIDENCE/vendor-package-metadata.log"
            dpkg-deb --extract "${archives[0]}" "$vendor_dir/$package"
          done
          PYTHONPATH=.github/scripts:src python -m forge_ci.facts \
            --output "$EVIDENCE/admission-facts" --vendor-dir "$vendor_dir" \
            2>&1 | tee "$EVIDENCE/admission-facts.log"
          date --utc '+%Y-%m-%d %H:%M:%S.%6N UTC' > "$EVIDENCE/sandbox-probe-start.txt"
          # Use the same delegated root and prerequisite check as the corpus tests.
          PYTHONPATH=src python - <<'PY' 2>&1 | tee "$EVIDENCE/sandbox-preflight.log"
          import os
          import subprocess
          from code_forge.mutation_engines.isolate import verify_isolation_support

          uid = os.getuid()
          cgroup_root = f'/sys/fs/cgroup/user.slice/user-{uid}.slice/user@{uid}.service'
          verify_isolation_support(cgroup_root)
          # Exercise the production namespace flags as the unprivileged test user.
          # Do not add AppArmor/sysctl overrides or degraded sandbox fallbacks.
          command = [
              'bwrap', '--die-with-parent', '--new-session', '--unshare-user',
              '--unshare-pid', '--unshare-net', '--unshare-uts', '--unshare-ipc',
              '--clearenv',
          ]
          for path in ('/usr', '/lib', '/lib64', '/bin', '/sbin', '/etc'):
              command.extend(('--ro-bind', path, path))
          command.extend((
              '--dev', '/dev', '--proc', '/proc', '--tmpfs', '/tmp',
              '--tmpfs', '/workspace', '--chdir', '/workspace', '--', '/usr/bin/true',
          ))
          with subprocess.Popen(command) as probe:
              print(f'Sandbox probe bwrap pid={probe.pid}', flush=True)
              try:
                  probe.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  probe.kill()
                  probe.wait()
                  raise
              if probe.returncode:
                  raise subprocess.CalledProcessError(probe.returncode, command)
          print(f'PASS: bubblewrap namespace launch and delegated cgroup prerequisites: {cgroup_root}')
          PY

      - name: Collect read-only sandbox failure diagnostics
        if: ${{ failure() && steps.sandbox.outcome == 'failure' }}
        timeout-minutes: 1
        run: |
          # Evidence only: no successful diagnostic can repair the failed gate.
          read_check() {
            printf '\nCOMMAND:'
            printf ' %q' "$@"
            printf '\n'
            if "$@"; then
              printf 'DIAGNOSTIC STATUS: 0\n'
            else
              printf 'DIAGNOSTIC STATUS: %s (unavailable or failed)\n' "$?"
            fi
          }
          {
            read_check timeout 3s uname -r
            read_check timeout 3s id
            read_check timeout 3s dpkg-query -W -f='${Package} ${Version}\n' apparmor bubblewrap
            read_check timeout 3s apparmor_parser --version
            read_check timeout 3s stat -c '%A %a %U:%G %n' /usr/bin/bwrap
            read_check timeout 3s getcap /usr/bin/bwrap
            read_check timeout 3s cat /proc/self/attr/current
            read_check timeout 3s cat /sys/module/apparmor/parameters/enabled
            read_check timeout 3s cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            read_check timeout 3s grep -E '^Cap(Inh|Prm|Eff|Bnd|Amb):|^NoNewPrivs:|^Seccomp:' /proc/self/status
            read_check sudo -n timeout 3s grep -E 'bwrap|unprivileged_userns' /sys/kernel/security/apparmor/profiles
            read_check timeout 3s sha256sum /etc/apparmor/parser.conf /etc/apparmor.d/abi/4.0 /etc/apparmor.d/tunables/global
            if [[ -r "$EVIDENCE/sandbox-probe-start.txt" ]]; then
              start="$(cat "$EVIDENCE/sandbox-probe-start.txt")"
              end="$(date --utc '+%Y-%m-%d %H:%M:%S.%6N UTC')"
              printf '\nAudit window: %s through %s; at most 100 matching entries\n' "$start" "$end"
              read_check sudo -n timeout 10s journalctl -k --since "$start" --until "$end" \
                --no-pager --output=short-iso-precise --lines=100 \
                --grep='apparmor="DENIED".*(bwrap|unprivileged_userns|userns_create)'
            else
              printf 'Audit unavailable: no recorded sandbox probe start time\n'
            fi
          } 2>&1 | tee "$EVIDENCE/sandbox-security-diagnostics.log"

      - name: Run real ownership and cancellation regressions
        timeout-minutes: 20
        run: |
          python -m pytest -v -ra -p no:cacheprovider \
            tests/test_mutation_process.py tests/test_mutation_process_capability.py \
            tests/test_mutation_cancellation.py \
            tests/test_mcp_simple_cancel.py tests/test_mcp_budgeted_cancel.py \
            --junitxml="$EVIDENCE/ownership.xml" 2>&1 | tee "$EVIDENCE/ownership.log"
          python - <<'PY' 2>&1 | tee "$EVIDENCE/ownership-coverage.log"
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          cases = ET.parse(Path(os.environ['EVIDENCE']) / 'ownership.xml').findall('.//testcase')
          assert cases, 'Ownership phase collected no tests'
          skipped = [case.attrib for case in cases if case.find('skipped') is not None]
          assert not skipped, f'Ownership/cancellation regressions must execute: {skipped}'
          print(f'PASS: all {len(cases)} ownership/cancellation cases executed without skips')
          PY

      - name: Run full service-free test selection
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.sandbox.outcome == 'success' && steps.install.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          python -m pytest -q -ra -m 'not real_api and not integration' -p no:cacheprovider \
            --junitxml="$EVIDENCE/pytest.xml" 2>&1 | tee "$EVIDENCE/pytest.log"

      - name: Run local process integration tests
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.sandbox.outcome == 'success' && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # These integration-marked tests use local subprocesses, not services.
          python -m pytest -v -ra -m integration -p no:cacheprovider \
            tests/test_lock_signals.py tests/test_mutation_detach_integration.py \
            --junitxml="$EVIDENCE/local-integration.xml" 2>&1 | tee "$EVIDENCE/local-integration.log"

      - name: Preserve logs and JUnit reports
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forge-evidence/
          if-no-files-found: warn
          retention-days: 14
