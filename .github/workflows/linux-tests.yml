name: Linux tests
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  PYTHONDONTWRITEBYTECODE: '1'
  SEMGREP_SEND_METRICS: 'off'
  SEMGREP_ENABLE_VERSION_CHECK: '0'
  OTEL_SDK_DISABLED: 'true'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up qualified Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.12'
    - name: Verify Linux process ownership prerequisites
      id: preflight
      timeout-minutes: 2
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-02.log preflight.log disk.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-02.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        # The stdout-pressure regression needs disk-backed temporary storage.
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        python - <<'PY' 2>&1 | (umask 077; exec tee "$EVIDENCE/preflight.log")
        import os
        from pathlib import Path
        import resource
        import select
        import subprocess
        import sys

        assert sys.platform == 'linux', sys.platform
        assert sys.implementation.name == 'cpython'
        assert sys.version_info[:2] == (3, 12), sys.version
        assert hasattr(os, 'pidfd_open'), 'Linux pidfd_open is required'
        assert resource.getrlimit(resource.RLIMIT_NOFILE)[1] > 1024, 'High-FD tests must run'
        # Do not treat absent or unreadable task-children as an empty tree.
        children_path = Path(f'/proc/{os.getpid()}/task/{os.getpid()}/children')
        children_path.read_bytes()
        child = subprocess.Popen([sys.executable, '-c', 'import time; time.sleep(30)'])
        try:
            children = {int(pid) for pid in children_path.read_bytes().split()}
            assert child.pid in children, f'Live child {child.pid} absent from {children_path}'
            fd = os.pidfd_open(child.pid)
            try:
                assert not select.select([fd], [], [], 0)[0], 'Live-child pidfd unexpectedly ready'
            finally:
                os.close(fd)
            print(f'PASS: readable {children_path}; live child {child.pid} visible; pidfd usable')
            print(sys.version)
        finally:
            child.terminate()
            child.wait(timeout=5)
        PY
        df -h "$TMPDIR" | (umask 077; exec tee "$EVIDENCE/disk.log")
    - name: Remove the image's system git-lfs filters
      id: gitconfig
      timeout-minutes: 2
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-03.log git-config.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-03.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        # The runner image ships /etc/gitconfig with git-lfs clean/process
        # filters. The conventions resolver refuses to cache whenever any
        # filter is configured, so its caching tests fail on the image's
        # config. The test suite scrubs every GIT_* variable, so
        # GIT_CONFIG_NOSYSTEM cannot help; edit the ephemeral runner's
        # system config instead. Nothing in this repository uses LFS.
        sudo git config --system --remove-section filter.lfs || true
        # Exit status 1 with no output means no clean/process filter is left.
        rc=0
        git config --system --null --get-regexp '^filter\..*\.(clean|process)$' || rc=$?
        test "$rc" -eq 1
        git config --list --show-origin | (umask 077; exec tee "$EVIDENCE/git-config.log")
    - name: Install and verify bubblewrap
      id: bwrap
      timeout-minutes: 5
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-04.log bwrap.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-04.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        # The patch-corpus tests run real mutation sandboxes with bwrap.
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor.
        # This only changes the ephemeral runner.
        # Fixed stage labels only; never dump environment or package configuration.
        setup_start() {
          setup_phase=$1
          setup_started=$SECONDS
          printf 'setup:%s:start\n' "$setup_phase"
        }
        setup_end() {
          printf 'setup:%s:end rc=%s elapsed_s=%s\n' "$setup_phase" "$1" "$((SECONDS - setup_started))"
          setup_phase=
        }
        trap 'setup_rc=$?; set +e; if [[ -n ${setup_phase:-} ]]; then setup_end "$setup_rc"; fi; exit "$setup_rc"' EXIT
        setup_start apt-update
        sudo apt-get update -q
        setup_end 0
        setup_start apt-install
        sudo apt-get install -y -q bubblewrap
        setup_end 0
        setup_start sysctl
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        setup_end 0
        setup_start version
        bwrap --version
        setup_end 0
        setup_start smoke
        bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc true \
          2>&1 | (umask 077; exec tee "$EVIDENCE/bwrap.log")
        setup_end 0
    - name: Publish failed bubblewrap setup transcript
      if: ${{ always() && steps.bwrap.outcome == 'failure' }}
      run: |
        set +x
        python scripts/ci_publish_failure_log.py --directory "$RUNNER_TEMP/forge-evidence" --phase "setup-bwrap"
    - name: Install declared extras and qualified pytest
      id: install
      timeout-minutes: 10
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-05.log install.log system-pytest-install.log system-code-forge-install.log interpreters.log previous-pytest-install.log pip-check.log requirements.freeze.txt; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-05.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python -m pip install -e '.[dev,mcp,semgrep,vertex]' 'pytest==9.2.0' \
          2>&1 | (umask 077; exec tee "$EVIDENCE/install.log")
        # Some FIXVAL fixtures use /usr/bin/python3 and reset PYTHONPATH.
        # Its normal user site works without modifying the system interpreter.
        python -m pip install --target "$(/usr/bin/python3 -m site --user-site)" 'pytest==9.2.0' \
          2>&1 | (umask 077; exec tee "$EVIDENCE/system-pytest-install.log")
        # Invocation-audit tests start /usr/bin/python3 children that import
        # code_forge. Put a copy of the package in its normal user site.
        python -m pip install --no-deps --target "$(/usr/bin/python3 -m site --user-site)" . \
          2>&1 | (umask 077; exec tee "$EVIDENCE/system-code-forge-install.log")
        for interpreter in python /usr/bin/python3; do
          "$interpreter" -c 'import sys, pytest; assert sys.implementation.name == "cpython"; assert sys.version_info[:2] == (3, 12), sys.version; assert pytest.__version__ == "9.2.0"; print(sys.executable, sys.version, "pytest", pytest.__version__)'
        done | (umask 077; exec tee "$EVIDENCE/interpreters.log")
        # Keep the previously qualified runtime executable in an isolated venv.
        # Its qualification cases must not turn into skips when the dev pin moves.
        python -m venv "$RUNNER_TEMP/forge-pytest-9.1.1"
        "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" -m pip install 'pytest==9.1.1' \
          2>&1 | (umask 077; exec tee "$EVIDENCE/previous-pytest-install.log")
        export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        python -m pip check 2>&1 | (umask 077; exec tee "$EVIDENCE/pip-check.log")
        python -m pip freeze | (umask 077; exec tee "$EVIDENCE/requirements.freeze.txt")
    - name: Collect original selections and partition every module
      timeout-minutes: 8
      run: |-
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-06.log collection.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-06.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        diagnostic_invocation=$(python -c 'import secrets; print(secrets.token_hex(16))')
        [[ "$diagnostic_invocation" =~ ^[0-9a-f]{32}$ ]]
        printf 'diagnostic_invocation=%s\n' "$diagnostic_invocation" >> "$GITHUB_OUTPUT"
        python scripts/ci_private_transport.py plan --sha "$GITHUB_SHA" \
          --directory "$RUNNER_TEMP/forge-plan" --public-directory forge-linux-public --diagnostic-directory "$EVIDENCE/diagnostics" --diagnostic-invocation "$diagnostic_invocation" 2>&1 | (umask 077; exec tee "$EVIDENCE/collection.log")
      id: public_plan
    - name: Prepare fixed public CI summary
      id: public_summary
      if: ${{ always() }}
      env:
        CI_JOB_STATUS: ${{ job.status }}
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-07.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-07.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python scripts/ci_private_transport.py summary --job plan \
          --status "$CI_JOB_STATUS" --public-directory forge-linux-public
    - name: Prepare fixed public CI diagnostics
      id: public_diagnostics
      if: ${{ always() }}
      env:
        CI_JOB_STATUS: ${{ job.status }}
        CI_PLAN_INVOCATION: ${{ steps.public_plan.outputs.diagnostic_invocation }}
      run: |
        exec >/dev/null 2>&1
        set +x
        set -euo pipefail
        original_umask=$(umask)
        umask 077
        export TMPDIR="$RUNNER_TEMP/forge-tests"
        export EVIDENCE="$RUNNER_TEMP/forge-evidence"
        mkdir -p "$TMPDIR" "$EVIDENCE"
        [[ -d "$TMPDIR" && ! -L "$TMPDIR" && -d "$EVIDENCE" && ! -L "$EVIDENCE" ]]
        chmod 700 "$TMPDIR" "$EVIDENCE"
        for private_log in step-90.log; do
          [[ ! -e "$EVIDENCE/$private_log" && ! -L "$EVIDENCE/$private_log" ]]
          (set -o noclobber; : >"$EVIDENCE/$private_log")
        done
        unset private_log
        exec >"$EVIDENCE/step-90.log" 2>&1
        umask "$original_umask"
        unset original_umask
        if [[ -x "$RUNNER_TEMP/forge-pytest-9.1.1/bin/python" ]]; then
          export FORGE_QUALIFICATION_PYTHON="$RUNNER_TEMP/forge-pytest-9.1.1/bin/python"
        fi
        python scripts/ci_private_transport.py diagnostics --job plan \
          --status "$CI_JOB_STATUS" --directory "$EVIDENCE/diagnostics" \
          --public-directory forge-linux-diagnostics \
          --invocation "plan=$CI_PLAN_INVOCATION"
    - name: Preserve fixed public diagnostics
      if: ${{ always() && steps.public_diagnostics.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: diagnostics-linux-plan-${{ github.run_attempt }}
        path: forge-linux-diagnostics/diagnostics.json
        if-no-files-found: error
        retention-days: 14
    - name: 'Archive attempt: linux-collection-plan'
      if: ${{ always() && steps.public_summary.outcome == 'success' && steps.public_plan.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: archive-linux-collection-plan-${{ github.run_attempt }}
        path: |-
          forge-linux-public/plan.json
          forge-linux-public/collection-full.json
          forge-linux-public/collection-ownership.json
          forge-linux-public/collection-cgroup.json
          forge-linux-public/collection-local.json
        if-no-files-found: error
        retention-days: 14
      id: archive_8
    - name: Preserve linux-collection-plan
      if: ${{ always() && steps.archive_8.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: linux-collection-plan
        path: |-
          forge-linux-public/plan.json
          forge-linux-public/collection-full.json
          forge-linux-public/collection-ownership.json
          forge-linux-public/collection-cgroup.json
          forge-linux-public/collection-local.json
        if-no-files-found: error
        retention-days: 14
        overwrite: true
    - name: 'Archive attempt: linux-plan-evidence'
      if: ${{ always() && steps.public_summary.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: archive-linux-plan-evidence-${{ github.run_attempt }}
        path: forge-linux-public/summary.json
        if-no-files-found: error
        retention-days: 14
      id: archive_10
    - name: Preserve linux-plan-evidence
      if: ${{ always() && steps.archive_10.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: linux-plan-evidence
        path: forge-linux-public/summary.json
        if-no-files-found: error
        retention-days: 14
        overwrite: true
  process-contracts:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
