  linux-tests:
    name: linux-tests
    needs:
    - plan
    - process-contracts
    - service-free
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
