        def ordinary_executable(path):
            requested = Path(path)
            canonical_path = requested.resolve(strict=True)
            name = requested.name
            expected = (PROVIDER_ROOT + "/bin/python3.12" if path.startswith(PROVIDER_ROOT + "/") else
                        "/usr/bin/" + {"sh": "dash", "python3": "python3.12"}.get(name, name))
            need(str(canonical_path) == expected, "finite executable canonical path changed: " + path)
            links = []
            for component in (requested, *requested.parents):
                if component.is_symlink():
                    target = os.readlink(component)
                    allowed = "python3.12" if str(component) == PROVIDER_ROOT + "/bin/python" else SYSTEM_LINKS.get(str(component))
                    need(target == allowed, "finite executable symlink changed: component=" + repr(str(component))
                         + "; expected=" + repr(allowed) + "; observed=" + repr(target))
                    links.append({"path": str(component), "target": target})
            info = canonical_path.stat()
            # These exact two post-setup host interpreters are trusted provider inputs,
            # not sandbox-mounted runtimes. Record their build owner and write modes;
            # never admit setid or file capabilities. This does not attest immutable
            # bytes or protect against hostile host users/dependencies. System tools
            # still require UID 0 and no group/world write. No prefix/caller flag widens
            # the class; final admission compares the recorded UID/GID/mode unchanged.
            provider = path in {PROVIDER_ROOT + "/bin/python", PROVIDER_ROOT + "/bin/python3.12"}
            forbidden_mode = 0o6000 if provider else 0o6022
            numeric_owner = all(type(value) is int and 0 <= value < 2**32 for value in (info.st_uid, info.st_gid))
            need(stat.S_ISREG(info.st_mode) and numeric_owner and (provider or info.st_uid == 0)
                 and not info.st_mode & forbidden_mode,
                 "finite executable metadata rejected: requested=" + repr(path) + "; canonical=" + repr(str(canonical_path))
                 + "; uid=" + str(info.st_uid) + "; gid=" + str(info.st_gid) + "; mode=" + oct(info.st_mode)
                 + "; owner_rule=" + ("recorded-provider-build-owner" if provider else "system-uid-0"))
            with canonical_path.open("rb") as stream:
                need(stream.read(4) == b"\x7fELF", "unreviewed executable shebang")
            try:
                caps = os.getxattr(canonical_path, "security.capability")
            except OSError as exc:
                need(exc.errno == errno.ENODATA, "cannot establish executable capability absence")
            else:
                need(not caps, "finite executable has file capabilities")
            return {"path": path, "canonical": expected, "uid": info.st_uid, "gid": info.st_gid,
                    "mode": stat.S_IMODE(info.st_mode), "symlinks": links, "elf": True, "file_capabilities": False}


