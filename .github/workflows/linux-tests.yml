name: Linux tests
'on':
  push:
    branches:
    - ci/baseline-b-4dd7214cf1a24483a42c7e19cfc8ec28
permissions:
  contents: read
concurrency:
  group: forge-linux-admitted-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  linux-tests:
    name: linux-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      OTEL_SDK_DISABLED: 'true'
    steps:
    - name: Stage fixed policy source 1/16
