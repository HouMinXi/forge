        @contextmanager
        def _network_deadline(seconds: float):
            """Bound DNS, TLS, headers and trickling bodies; never extend an active timer."""
            need(signal.getitimer(signal.ITIMER_REAL) == (0.0, 0.0), "network deadline already active")
            previous = signal.getsignal(signal.SIGALRM)
            def expired(signum, frame):
                raise SetupError("metadata deadline exceeded")
            signal.signal(signal.SIGALRM, expired)
            signal.setitimer(signal.ITIMER_REAL, seconds)
            try:
                yield
            finally:
                signal.setitimer(signal.ITIMER_REAL, 0)
                signal.signal(signal.SIGALRM, previous)


