            def __init__(self, allowed, fetcher=None, *, binding=None):
                self.allowed, self.fetcher = frozenset(allowed), fetcher
                self.binding = binding
                self.workflow_id = binding.get("workflow_id") if type(binding) is dict else None
                self.deadline, self.requests, self.total = time.monotonic() + 30, 0, 0
                self.digests = {}

            def get(self, path):
                need(path in self.allowed and path not in self.digests, "unreviewed or repeated metadata endpoint")
                remaining = self.deadline - time.monotonic()
                need(remaining > 0 and self.requests < MAX_REQUESTS, "metadata request/deadline bound exceeded")
                self.requests += 1
                timeout = min(5, remaining)
                connection = None
                try:
                    with _network_deadline(timeout):
                        if self.fetcher is not None:
                            raw, link = self.fetcher(API_ROOT + path)
                        else:
                            need(type(self.binding) is dict, "metadata credential binding is required")
                            validate_binding(self.binding, native=set(self.binding) == NATIVE_BINDING_KEYS)
                            paths = (live_metadata_paths(self.binding, _id(self.workflow_id, "metadata workflow id"))
                                     if self.workflow_id is not None else
                                     {"workflow": "/actions/workflows/" + self.binding["workflow_path"].rsplit("/", 1)[1]})
                            need(path in paths.values(), "unreviewed authenticated metadata endpoint")
                            connection = http.client.HTTPSConnection("api.github.com", timeout=timeout, context=ssl.create_default_context())
                            connection.request("GET", "/repos/HouMinXi/forge" + path, headers={
                                "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
                                "User-Agent": "forge-ci-owner-push/1", "Accept-Encoding": "identity",
                                "Authorization": b"Bearer " + _read_metadata_credential(self.binding)})
                            response = connection.getresponse()
                            if response.status != 200:
                                # Only nonsecret finite numeric provider diagnostics; no response body/header dump.
                                diagnostics = {"status": response.status}
                                for name in ("X-RateLimit-Remaining", "X-RateLimit-Reset", "Retry-After"):
                                    value = response.getheader(name)
                                    if type(value) is str and re.fullmatch(r"[0-9]{1,20}", value):
                                        diagnostics[name] = value
                                raise SetupError("metadata HTTP/rate-limit failure " + canonical(diagnostics).decode())
                            need(response.getheader("Content-Type", "").split(";", 1)[0].strip() == "application/json",
                                 "metadata is not JSON")
                            need(response.getheader("Content-Encoding", "identity") == "identity", "encoded metadata rejected")
                            declared = response.getheader("Content-Length")
                            if declared is not None:
                                need(re.fullmatch(r"[0-9]{1,8}", declared) is not None and int(declared) <= MAX_API,
                                     "metadata declared byte bound exceeded")
                            raw, link = response.read(MAX_API + 1), response.getheader("Link", "")
                            if declared is not None:
                                need(len(raw) == int(declared), "truncated metadata")
                        need(type(raw) is bytes and 0 < len(raw) <= MAX_API, "metadata response byte bound exceeded")
                        need(type(link) is str and len(link) <= 4096, "invalid metadata pagination header")
                        self.total += len(raw)
                        need(self.total <= MAX_API_TOTAL and time.monotonic() < self.deadline, "metadata total/deadline bound exceeded")
                        value = parse_json(raw, limit=MAX_API)
                        self.digests[path] = hashlib.sha256(raw).hexdigest()
                        return value, link
                except SetupError:
                    raise
                except Exception:  # noqa: BLE001 - transport exceptions must never expose request credentials.
                    raise SetupError("metadata unavailable") from None
                finally:
                    if connection is not None:
                        try:
                            connection.close()
                        except Exception:  # noqa: BLE001 - connection cleanup may retain credential-bearing request state.
                            raise SetupError("metadata connection cleanup failed") from None

            def one(self, path):
                value, link = self.get(path)
                need(not link, "unexpected singleton pagination")
                return value

            def collection(self, path, key):
                """Only one complete item on the fixed first page is admitted."""
                value = self.one(path)
                count = value.get("total_count")
                need(type(count) is int and count == 1, "missing or ambiguous metadata collection")
                items = value.get(key)
                need(type(items) is list and len(items) == 1, "partial metadata collection")
                return items


