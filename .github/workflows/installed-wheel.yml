name: Installed wheel controls

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed commit SHA for this manual qualification.
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}

jobs:
  wheel-runtime:
    name: installed-wheel-${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: py312
            runner: ubuntu-24.04
            python: '3.12'
          - runtime: py314
            runner: ubuntu-26.04
            python: '3.14'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require the exact event source
        shell: bash
        run: |
          exec >/dev/null 2>&1
          set +x
          set -euo pipefail
          /usr/bin/python3 -I -S -B scripts/ci_stock_runner.py request
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Provision declared dependency wheels (setup only)
        id: provision
        shell: bash
        run: |
          exec >/dev/null 2>&1
          set +x
          set -euo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/forge-wheel-setup.XXXXXXXX")
          exec >"$private/commands.log" 2>&1
          python -m pip wheel --index-url https://pypi.org/simple \
            --wheel-dir "$RUNNER_TEMP/forge-wheelhouse" \
            'setuptools>=77' wheel 'pytest==9.2.0' 'pyyaml>=6.0' 'unidiff>=0.7.5,<0.8.0'
      - name: Build and qualify installed wheel offline
        id: qualify
        shell: bash
        run: |
          exec >/dev/null 2>&1
          set +x
          set -euo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/forge-wheel-qualification.XXXXXXXX")
          exec >"$private/commands.log" 2>&1
          date -u +%s >"$private/started"
          qualification_code=0
          python scripts/qualify_installed_wheel.py \
            --wheelhouse "$RUNNER_TEMP/forge-wheelhouse" \
            --output "$private/qualification" || qualification_code=$?
          if [[ "$qualification_code" != 0 ]]; then
            exit "$qualification_code"
          fi
          date -u +%s >"$private/finished"
      - name: Read-only current-wheel no-site dependency control (3.14 only)
        id: no_site_control
        if: ${{ matrix.runtime == 'py314' && steps.qualify.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          exec >/dev/null 2>&1
          set +x
          set -euo pipefail
          umask 077
          matches=("$RUNNER_TEMP"/forge-wheel-qualification.*/qualification)
          [[ "${#matches[@]}" == 1 && -d "${matches[0]}" ]]
          private=$(mktemp -d "$RUNNER_TEMP/forge-no-site-status.XXXXXXXX")
          control_code=0
          python -I -S -B scripts/check_no_site_installation.py \
            --wheel-evidence "${matches[0]}" --expected-source-sha "$SOURCE_SHA" \
            --status-output "$private/status.json" || control_code=$?
          echo "control_shell_exit=$control_code" >> "$GITHUB_OUTPUT"
          exit "$control_code"
      - name: Publish only validated no-site control stage
        if: ${{ always() && matrix.runtime == 'py314' && steps.no_site_control.outcome != 'skipped' }}
        env:
          CONTROL_EXIT: ${{ steps.no_site_control.outputs.control_shell_exit }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          python -I -S -B - 2>/dev/null <<'PY'
          import json, os, stat, sys
          try:
              def unique(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError()
                      result[key] = value
                  return result
              code_text = os.environ['CONTROL_EXIT']
              if not code_text.isascii() or not code_text.isdecimal() or str(int(code_text)) != code_text:
                  raise ValueError()
              code = int(code_text)
              if not 0 <= code <= 255:
                  raise ValueError()
              candidates = []
              with os.scandir(os.environ['RUNNER_TEMP']) as entries:
                  for index, entry in enumerate(entries):
                      if index >= 20000:
                          raise ValueError()
                      if entry.name.startswith('forge-no-site-status.'):
                          candidates.append(entry.path)
                          if len(candidates) > 1:
                              raise ValueError()
              if len(candidates) != 1:
                  raise ValueError()
              parent = candidates[0]
              parent_fd = os.open(parent, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              info = os.fstat(parent_fd)
              if not stat.S_ISDIR(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o700 or info.st_uid != os.getuid():
                  raise ValueError()
              fd = os.open('status.json', os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=parent_fd)
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or stat.S_IMODE(before.st_mode) != 0o600 or before.st_uid != os.getuid() or before.st_nlink != 1 or not 0 < before.st_size <= 2048:
                      raise ValueError()
                  raw = os.read(fd, 2049)
                  after = os.fstat(fd)
                  named = os.stat('status.json', dir_fd=parent_fd, follow_symlinks=False)
                  current_parent = os.lstat(parent)
                  if any(getattr(info, key) != getattr(current_parent, key) for key in ('st_dev','st_ino','st_mode','st_uid')):
                      raise ValueError()
                  if any(getattr(before, key) != getattr(after, key) or getattr(before, key) != getattr(named, key) for key in ('st_dev','st_ino','st_size','st_mode','st_mtime_ns','st_ctime_ns')) or len(raw) != before.st_size or not raw.endswith(b'\n'):
                      raise ValueError()
              finally:
                  os.close(fd)
                  os.close(parent_fd)
              row = json.loads(raw, object_pairs_hook=unique, parse_constant=lambda _: (_ for _ in ()).throw(ValueError()))
              stages = {'INITIALIZE','RUNTIME','VERIFY_INSTALLATION','SOURCE_IDENTITY','CONTROL_SETUP','CHILD_SETUP','BASELINE_PREPARE','BASELINE_IMPORT','DIAGNOSTIC_PREPARE','DIAGNOSTIC_IMPORT','DIAGNOSTIC_PROBE_RECEIPT','NEGATIVE_CONSOLE','NEGATIVE_PREFIX','NEGATIVE_ROOTS','NEGATIVE_PROBE','COMPLETE'}
              categories = {'NONE','NO_DELIVERY','INVALID_DATA','OS_ERROR','TIMEOUT','INTERNAL_ERROR','INVALID_RECEIPT','VERIFY_TARGET_METADATA','VERIFY_CONSOLE_BINDING','VERIFY_SOURCE_BINDING','VERIFY_SITE_PATH_HOOK','VERIFY_STARTUP_ADMISSION','VERIFY_RUNTIME_PREFIX'}
              if type(row) is not dict or set(row) != {'schema','stage','category','child_exit'} or row['schema'] != 'forge-no-site-control-v1':
                  raise ValueError()
              if type(row['stage']) is not str or row['stage'] not in stages or type(row['category']) is not str or row['category'] not in categories:
                  raise ValueError()
              if row['category'].startswith('VERIFY_') and row['stage'] != 'VERIFY_INSTALLATION':
                  raise ValueError()
              child = row['child_exit']
              if child is not None and (type(child) is not int or not -255 <= child <= 255):
                  raise ValueError()
              if (code == 0) != (row['stage'] == 'COMPLETE') or (code == 0) != (row['category'] == 'NONE'):
                  raise ValueError()
              if code == 0 and child != 0:
                  raise ValueError()
              if row['stage'] in {'INITIALIZE','RUNTIME','VERIFY_INSTALLATION','SOURCE_IDENTITY','CONTROL_SETUP'} and child is not None:
                  raise ValueError()
              if row['stage'] == 'DIAGNOSTIC_PROBE_RECEIPT' and child != 0:
                  raise ValueError()
              if row['category'] == 'NO_DELIVERY' and row['stage'] != 'INITIALIZE':
                  raise ValueError()
              if row['category'] == 'TIMEOUT' and (child is not None or row['stage'] not in {'CHILD_SETUP','VERIFY_INSTALLATION'}):
                  raise ValueError()
              # Only this independent, closed projection can reach the public log.
              row['control_shell_exit'] = code
              row['qualification'] = 'NOT_ASSESSED'
              print(json.dumps(row, sort_keys=True))
          except Exception:
              raise SystemExit(74)
          PY
      - name: Verify original qualified wheel is safe to publish
        id: wheel_release
        env:
          SETUP_OUTCOME: ${{ steps.provision.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualify.outcome }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          exec >/dev/null 2>&1
          set +x
          set -euo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/forge-wheel-release.XXXXXXXX")
          exec >"$private/commands.log" 2>&1
          /usr/bin/python3 -I -S -B scripts/installed_wheel_publication.py \
            "$RUNNER_TEMP" forge-installed-wheel-artifact
      - name: Prepare only the fixed packaging summary
        id: public_summary
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          SETUP_OUTCOME: ${{ steps.provision.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualify.outcome }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          exec >/dev/null 2>&1
          set +x
          set -euo pipefail
          umask 077
          private=$(mktemp -d "$RUNNER_TEMP/forge-wheel-publication.XXXXXXXX")
          exec >"$private/commands.log" 2>&1
          mkdir -m 700 forge-installed-wheel-public
          helper_code=0
          /usr/bin/python3 -I -S -B scripts/installed_wheel_public_summary.py \
            "$SETUP_OUTCOME" "$QUALIFICATION_OUTCOME" "$JOB_STATUS" \
            >"$private/candidate.json" 2>"$private/helper-stderr.txt" || helper_code=$?
          # Independently validate the complete envelope, the helper's exit,
          # and the runner's actual outcomes. No helper bytes go to the log.
          /usr/bin/python3 -I -S -B - "$private/candidate.json" "$helper_code" <<'PY'
          import json
          import os
          import stat
          import sys

          def unique_keys(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate")
                  value[key] = item
              return value

          def reject_number(value):
              raise ValueError("number")

          setup = os.environ["SETUP_OUTCOME"]
          qualification = os.environ["QUALIFICATION_OUTCOME"]
          job = os.environ["JOB_STATUS"]
          outcomes = {"success", "failure", "cancelled", "skipped"}
          expected = {
              "schema": "forge-public-installed-wheel-summary-v1",
              "mode": "installed-wheel",
              "scope": "PARTIAL_RUNTIME_ONLY",
              "status": "UNKNOWN",
              "reason": "unavailable",
              "raw_evidence": "NOT_PUBLISHED",
          }
          if setup in outcomes and qualification in outcomes and job in outcomes - {"skipped"}:
              if {setup, qualification, job} & {"failure", "cancelled"}:
                  expected.update(status="STOP", reason="execution_failed")
              elif setup == qualification == job == "success":
                  expected.update(status="PASS", reason="controls_complete")
              else:
                  expected.update(reason="not_completed")
          expected_code = "0" if expected["status"] == "PASS" else "2"
          if sys.argv[2] != expected_code:
              raise ValueError("helper failed")
          fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW)
          try:
              before = os.fstat(fd)
              if not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= 1024:
                  raise ValueError("candidate")
              with os.fdopen(fd, "rb", closefd=False) as handle:
                  raw = handle.read(1025)
              after = os.fstat(fd)
              if len(raw) != before.st_size or (
                  before.st_size, before.st_mtime_ns, before.st_ctime_ns
              ) != (after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                  raise ValueError("changed")
          finally:
              os.close(fd)
          value = json.loads(raw, object_pairs_hook=unique_keys,
                             parse_constant=reject_number, parse_float=reject_number,
                             parse_int=reject_number)
          if type(value) is not dict or value != expected:
              raise ValueError("envelope")
          # Serialize only constructed constants, never the candidate bytes.
          fd = os.open("forge-installed-wheel-public/summary.json",
                       os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, "w") as handle:
              handle.write(json.dumps(expected, sort_keys=True, separators=(",", ":")) + "\n")
          PY
      - name: Publish only the fixed packaging summary
        if: ${{ always() && steps.public_summary.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-wheel-summary-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: forge-installed-wheel-public/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the original verified wheel download
        if: ${{ success() && steps.wheel_release.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-wheel-evidence-${{ matrix.runtime }}-${{ github.run_attempt }}
          path: forge-installed-wheel-artifact/code_review_forge-2.9.0-py3-none-any.whl
          if-no-files-found: error
          retention-days: 14

  installed-wheel:
    name: installed-wheel
    needs: [wheel-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require both installed runtime qualifications
        env:
          RUNTIME_RESULT: ${{ needs.wheel-runtime.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNTIME_RESULT" = success
