name: Lint changed files

# The repository is not ruff-clean (#105), so this job lints only the Python
# files a pull request touches. See "Linting" in CONTRIBUTING.md.
'on':
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff uses the merge base with the target branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the pinned ruff
        run: python -m pip install "$(python scripts/lint_changed.py --print-requirement)"

      - name: Lint files changed by this pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/lint_changed.py --base "origin/$BASE_REF"
