    stream: true
    headers:
      x-omniroute-no-memory: "1"
      x-omniroute-compression: "off"
      x-omniroute-no-cache: "true"
  agnes-cn-2:
    type: api
    format: openai
    base_url: "https://100.109.180.117:20128/v1"
    api_key_env: OMNIROUTE_API_KEY
    model: agnes-cn-2
    max_tokens: 65536
    timeout_s: 2400
    stream: true
    headers:
      x-omniroute-no-memory: "1"
      x-omniroute-compression: "off"
      x-omniroute-no-cache: "true"
  agnes-cn-3:
    type: api
    format: openai
    base_url: "https://100.109.180.117:20128/v1"
    api_key_env: OMNIROUTE_API_KEY
    model: agnes-cn-3
    max_tokens: 65536
    timeout_s: 2400
    stream: true
    headers:
      x-omniroute-no-memory: "1"
      x-omniroute-compression: "off"
      x-omniroute-no-cache: "true"
  agnes-intl-2:
    type: api
    format: openai
    base_url: "https://100.109.180.117:20128/v1"
    api_key_env: OMNIROUTE_API_KEY
    model: agnes-intl-2
    max_tokens: 65536
