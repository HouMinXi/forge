[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-forge"
version = "2.1.0"
description = "3-state quality gate for code review"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "Minxi Hou", email = "houminxi@gmail.com"},
]
dependencies = [
    "pyyaml>=6.0",
    "unidiff>=0.7.5,<0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mutmut>=3.3,<4.0",
]
vertex = [
    "google-auth>=2.35.0",
    "requests>=2.20.0",
]

[project.scripts]
code-forge = "code_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_forge = ["skills/**/*", "skills/**/.gitkeep"]

[tool.pytest.ini_options]
markers = [
    "real_api: opt-in tests that call real backends (skipped by default)",
]
pythonpath = ["src"]
norecursedirs = ["tests/eval/corpus/base_files"]
