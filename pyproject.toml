[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-forge"
version = "2.9.0"
description = "3-state quality gate for code review"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "Minxi Hou", email = "houminxi@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0",
    "unidiff>=0.7.5,<0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.5",
    "mutmut>=3.4,<4.0",
    "jsonschema>=4.18",
]
vertex = [
    "google-auth>=2.35.0",
    "requests>=2.20.0",
]
mcp = [
    "mcp>=1.27,<2",
]
semgrep = [
    # PATH tool and forge venv pin the 1.176.x series so
    # declaration, PATH, and the forge venv cannot drift independently.
    "semgrep>=1.176,<1.178",
]
# Only the corpus GENERATOR needs this -- building tests/eval/swebench from
# SWE-bench_Verified. The generated corpus is committed, so running an
# evaluation, or the test suite, does not pull it in. Kept separate from dev
# for that reason: it is a heavy dependency (pyarrow, pandas) that most
# contributors never execute.
eval-corpus = [
    "datasets>=5.0,<6",
]

[project.scripts]
code-forge = "code_forge.cli:main"
code-forge-mcp = "code_forge.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
code_forge = ["skills/**/*", "skills/**/.gitkeep", "rules/**/*", "gate.schema.json"]

[tool.ruff]
line-length = 105
# Reconstructed base files are deliberately not valid Python: padding to a
# hunk's start line splits class and function bodies. They are input data
# for diff-mode review, not source, and linting them reports the corpus
# working as designed as if it were a defect.
exclude = ["tests/eval/*/base_files"]

[tool.ruff.lint]
# Ruff's default is "every rule in the default set", which here means 2383
# findings dominated by formatting preference. A gate nobody can clear is a
# gate nobody reads, and the review pipeline pays for it: pre-existing
# advisories crowd the finding budget every round. Select the rules that
# report a defect rather than a taste, so a non-empty run means something.
select = [
    "F",      # Pyflakes: undefined names, unused imports, broken f-strings
    "E4",     # import placement
    "E7",     # comparison and statement errors
    "E9",     # syntax and IO errors
    "ASYNC",  # blocking calls inside coroutines
    "S",      # bandit: injection, unsafe temp files, silent excepts
    "BLE",    # blind except
    "B",      # bugbear: mutable defaults, loop-variable binding
    "TRY004", # raising the wrong type for a type check
    "PLE",    # pylint errors
    "PLW",    # pylint warnings that indicate real bugs
    "RUF013", # implicit Optional in annotations
    "PERF",   # provably redundant loops and comprehensions
    "DTZ",    # naive datetimes
]
# Rules whose findings are style, not defect. Each one was checked against
# this codebase before landing here; the counts are from `ruff check src/
# tests/` at the commit that introduced this block.
ignore = [
    "S101",   # assert in tests is the point of a test
    "S603",   # subprocess with a list argv is how this tool spawns backends
    "S607",   # partial executable paths: git, python, pytest resolve via PATH
    # This codebase is about review *passes* and LLM *tokens*, so bandit's
    # password heuristic fires on pass_provenance="manual" and
    # token_str="tokens: N/A". Checked: no credential is assigned in either.
    "S105",   # hardcoded password string
    "S106",   # hardcoded password argument
    "PLW1510",# subprocess.run without check=; call sites read returncode
    "PLW2901",# loop variable overwritten in body: deliberate in parsers here
]

[tool.ruff.lint.per-file-ignores]
# Tests spawn processes, write temp files and hold handles open on purpose.
"tests/*" = ["S108", "S110", "ASYNC230"]

[tool.pytest.ini_options]
markers = [
    "real_api: opt-in tests that call real backends (skipped by default)",
    "integration: marks tests requiring real infrastructure",
]
pythonpath = ["src"]
norecursedirs = ["tests/eval/corpus/base_files"]
